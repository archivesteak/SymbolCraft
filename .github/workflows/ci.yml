name: CI/CD Pipeline

on:
  push:
    branches: [ "**" ]  # Trigger on all branches
  pull_request:
    branches: [ "**" ]  # Trigger on all branches

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Check Kotlin formatting
      run: ./gradlew ktfmtCheck --stacktrace

    - name: Build plugin
      env:
        # Set empty signing vars to skip signing in regular CI builds
        SIGNING_KEY: ""
        SIGNING_PASSWORD: ""
      run: ./gradlew build --stacktrace

    - name: Run tests (if any)
      run: ./gradlew test --stacktrace
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          build/libs/*.jar
          build/distributions/*.zip

  example-test:
    name: Test Example Project
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # NOTE: no signing/Maven Central env here — unset secrets render as empty
    # strings and break the Gradle signing predicate on publishToMavenLocal.
    - name: Publish plugin to local repository
      run: ./gradlew publishToMavenLocal --stacktrace

    - name: Test example project
      working-directory: example
      run: |
        chmod +x ./gradlew
        # SymbolCraft is applied to :shared; both outputs are generated there
        ./gradlew :shared:generateSymbolCraftIcons :shared:generateSymbolCraftSymbolSets --stacktrace
        # Build the example project (Android + Desktop; iOS is built by the ios-build job)
        ./gradlew build --stacktrace

  ios-build:
    name: Build iOS example (Xcode)
    runs-on: macos-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Generate the SF Symbol catalog
      working-directory: example
      run: |
        chmod +x ./gradlew
        ./gradlew :shared:generateSymbolCraftSymbolSets --stacktrace
        ls shared/build/generated/symbolcraft/swiftui/SymbolCraft.xcassets

    # actool is what Xcode runs on asset catalogs: this proves the generated .symbolset bundles
    # are accepted before the full app build below.
    - name: Validate the catalog with actool
      working-directory: example
      run: |
        mkdir -p "$RUNNER_TEMP/actool"
        xcrun actool shared/build/generated/symbolcraft/swiftui/SymbolCraft.xcassets           --compile "$RUNNER_TEMP/actool"           --platform iphonesimulator           --minimum-deployment-target 16.0           --output-format human-readable-text           --warnings --errors
        test -f "$RUNNER_TEMP/actool/Assets.car"

    # Runs the "Compile Kotlin Framework" script phase (Gradle builds :shared and regenerates the
    # catalog), then compiles Symbols.swift and the catalog into the app.
    - name: Build the iOS app
      working-directory: example/iosApp
      run: |
        xcodebuild -project iosApp.xcodeproj -target iosApp -configuration Debug           -sdk iphonesimulator           CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""           build

  validate-plugin:
    name: Validate Plugin
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Validate plugin tasks
      run: |
        ./gradlew tasks --all | grep -i symbolcraft || echo "No SymbolCraft tasks found yet"
        ./gradlew publishToMavenLocal --stacktrace

    - name: Verify plugin publication
      run: |
        if [ -d ~/.m2/repository/io/github/archivesteak ]; then
          echo "Plugin published to local Maven repository"
          find ~/.m2/repository/io/github/archivesteak -name "*.jar" | head -5
        else
          echo "Plugin not found in local Maven repository"
          exit 1
        fi

    # What consumers actually see: the Maven metadata served by GitHub Packages for the plugin
    # and its three plugin-marker artifacts.
    - name: List versions published to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        ACTOR: ${{ github.actor }}
      run: |
        list_versions() {
          echo "== $1"
          curl -sf -u "$ACTOR:$GITHUB_TOKEN" "https://maven.pkg.github.com/$REPO/$1/maven-metadata.xml" | grep -oE '<(latest|version|lastUpdated)>[^<]*' | paste -sd ' ' - || echo "(not published)"
        }
        list_versions io/github/archivesteak/symbolcraft
        list_versions io/github/archivesteak/symbolcraft/io.github.archivesteak.symbolcraft.gradle.plugin
        list_versions io/github/archivesteak/symbolcraft/compose/io.github.archivesteak.symbolcraft.compose.gradle.plugin
        list_versions io/github/archivesteak/symbolcraft/apple/io.github.archivesteak.symbolcraft.apple.gradle.plugin

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    needs: [build, example-test, validate-plugin, ios-build]
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'chore(release):')

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Extract version from commit message
      id: extract_version
      # Passed through the environment: interpolating the message into the script would let
      # backticks or quotes in a commit body break (or execute inside) the shell.
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        VERSION=$(echo "$COMMIT_MSG" | grep -oP 'chore\(release\):\s*v\K[0-9]+\.[0-9]+\.[0-9]+')
        if [ -z "$VERSION" ]; then
          echo "No valid version found in commit message: $COMMIT_MSG"
          exit 1
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extracted version: $VERSION"

    - name: Verify version matches the committed build file
      run: |
        VERSION=${{ steps.extract_version.outputs.version }}
        if ! grep -q "version = \"$VERSION\"" build.gradle.kts; then
          echo "Commit message says v$VERSION but build.gradle.kts has a different version."
          echo "Bump version in build.gradle.kts before making the release commit."
          exit 1
        fi

    - name: Build release artifacts
      run: ./gradlew build publishToMavenLocal --stacktrace

    - name: List build artifacts
      run: |
        echo "Listing build directory contents:"
        find build -name "*.jar" -o -name "*.zip" | head -10
        echo "Current version in build.gradle.kts:"
        grep "version = " build.gradle.kts

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.extract_version.outputs.version }}
        name: v${{ steps.extract_version.outputs.version }}
        body: |
          ## SymbolCraft v${{ steps.extract_version.outputs.version }}

          Generate icons on-demand from multiple libraries (Material Symbols, Bootstrap Icons, etc.) for Compose Multiplatform with smart caching.

          ### Installation (GitHub Packages)
          ```kotlin
          // settings.gradle.kts
          pluginManagement {
              repositories {
                  maven {
                      url = uri("https://maven.pkg.github.com/archivesteak/SymbolCraft")
                      credentials {
                          username = providers.gradleProperty("gpr.user").orNull
                          password = providers.gradleProperty("gpr.key").orNull
                      }
                  }
                  gradlePluginPortal()
              }
          }
          // shared/build.gradle.kts (the module Xcode embeds)
          plugins {
              id("io.github.archivesteak.symbolcraft") version "${{ steps.extract_version.outputs.version }}"
          }
          ```
          GitHub Packages requires authentication even for public packages: set `gpr.user` and
          `gpr.key` (a PAT with `read:packages`) in `~/.gradle/gradle.properties`.

          ### Links
          - [GitHub Packages](https://github.com/archivesteak/SymbolCraft/packages)
          - [Documentation](https://github.com/archivesteak/SymbolCraft#readme)
        files: |
          build/libs/*.jar
          build/distributions/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
        token: ${{ secrets.GITHUB_TOKEN }}

  publish-gradle-plugin:
    name: Publish to Gradle Plugin Portal
    runs-on: ubuntu-latest
    needs: release
    # Dormant on this fork (no GRADLE_PUBLISH_* secrets, not on the Portal).
    # Set the ENABLE_GRADLE_PORTAL repository variable to 'true' to activate.
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'chore(release):') && vars.ENABLE_GRADLE_PORTAL == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Extract version from commit message
      id: extract_version
      # Passed through the environment: interpolating the message into the script would let
      # backticks or quotes in a commit body break (or execute inside) the shell.
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        VERSION=$(echo "$COMMIT_MSG" | grep -oP 'chore\(release\):\s*v\K[0-9]+\.[0-9]+\.[0-9]+')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Publish to Gradle Plugin Portal
      env:
        GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
        GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
      run: ./gradlew publishPlugins --stacktrace

  publish-maven-central:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: release
    # Dormant on this fork (no OSSRH_*/signing secrets, not on Maven Central).
    # Set the ENABLE_MAVEN_CENTRAL repository variable to 'true' to activate.
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'chore(release):') && vars.ENABLE_MAVEN_CENTRAL == 'true'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Extract version from commit message
      id: extract_version
      # Passed through the environment: interpolating the message into the script would let
      # backticks or quotes in a commit body break (or execute inside) the shell.
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        VERSION=$(echo "$COMMIT_MSG" | grep -oP 'chore\(release\):\s*v\K[0-9]+\.[0-9]+\.[0-9]+')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Publish to Maven Central
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      run: ./gradlew publishToMavenCentral --no-configuration-cache --stacktrace

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'corretto'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Extract version from commit message
      id: extract_version
      # Passed through the environment: interpolating the message into the script would let
      # backticks or quotes in a commit body break (or execute inside) the shell.
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        VERSION=$(echo "$COMMIT_MSG" | grep -oP 'chore\(release\):\s*v\K[0-9]+\.[0-9]+\.[0-9]+')
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    # GitHub Packages rejects re-uploads of an existing version, so publish only when the
    # served Maven metadata does not list it yet (the metadata is what consumers resolve).
    - name: Check if version is already published
      id: published_check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        ACTOR: ${{ github.actor }}
      run: |
        VERSION=${{ steps.extract_version.outputs.version }}
        METADATA=$(curl -sf -u "$ACTOR:$GITHUB_TOKEN" "https://maven.pkg.github.com/$REPO/io/github/archivesteak/symbolcraft/maven-metadata.xml" || true)
        echo "Published versions: $(echo "$METADATA" | grep -oE '<version>[^<]*' | sed 's/<version>//' | paste -sd ' ' -)"
        if echo "$METADATA" | grep -q "<version>$VERSION</version>"; then
          echo "Version $VERSION already exists on GitHub Packages; skipping publish."
          echo "exists=true" >> $GITHUB_OUTPUT
        else
          echo "exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Publish to GitHub Packages
      if: steps.published_check.outputs.exists != 'true'
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --stacktrace

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [publish-github-packages]
    if: always() && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'chore(release):')

    steps:
    - name: Notify success
      if: needs.publish-github-packages.result == 'success'
      run: |
        echo "SymbolCraft release completed successfully."
        echo "Plugin published to GitHub Packages"
        echo "https://github.com/archivesteak/SymbolCraft/packages"

    - name: Notify failure
      if: needs.publish-github-packages.result != 'success'
      run: |
        echo "SymbolCraft release failed!"
        echo "GitHub Packages: ${{ needs.publish-github-packages.result }}"
        echo "Check the publish-github-packages logs for details"
